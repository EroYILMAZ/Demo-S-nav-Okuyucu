plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.sinavokuyucu'
    compileSdk 34

    defaultConfig {
        applicationId 'tr.sinavokuyucu'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Mağaza dışı dağıtım: bu bilgisayarın imza anahtarıyla imzalanır
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.8.2'
    // seri çekim kamerası
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.guava:listenablefuture:1.0'
    // kotlin-stdlib-jdk7/jdk8 eski sürümleriyle çakışmayı önler (aynı sınıflar iki kez gelmesin)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
